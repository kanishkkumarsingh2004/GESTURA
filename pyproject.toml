[project]
name = "gesture-recognition"
version = "1.0.0"
description = "Real-time hand gesture recognition and audio assistant using PyTorch, OpenCV and Streamlit"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "streamlit-webrtc>=0.48.0",
    "opencv-python-headless>=4.9.0",
    "mediapipe>=1.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "fastapi>=0.162.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.9.0",
    "bandit>=1.7.0",
    "types-pyyaml>=6.0.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "N"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
